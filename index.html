<script>
(function () {
"use strict";
// ============================== BASE ==============================
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const W = 1024, H = 640, FLOOR_TOP = 470;
function $(id){ return document.getElementById(id); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

// ============================== AUDIO ==============================
const AU = { ctx:null, on:true };
function actx(){ if(!AU.ctx){ try { AU.ctx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ AU.on=false; } } return AU.ctx; }
function beep(freq, dur, type, vol, delay){
  if(!AU.on) return; const c = actx(); if(!c) return;
  const t0 = c.currentTime + (delay||0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = type||'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol||0.08, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + (dur||0.2));
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + (dur||0.2) + 0.05);
}
const SND = {
  click(){ beep(660,0.06,'triangle',0.05); },
  ok(){ beep(523,0.12,'sine',0.09); beep(784,0.25,'sine',0.09,0.1); },
  win(){ [523,659,784,1047].forEach(function(f,i){ beep(f,0.3,'sine',0.08,i*0.12); }); },
  err(){ beep(140,0.25,'sawtooth',0.06); },
  door(){ beep(90,0.5,'sine',0.12); beep(60,0.7,'sine',0.1,0.08); },
  note(n){ beep(n,0.35,'triangle',0.09); },
  step(){ beep(90+Math.random()*30,0.03,'triangle',0.02); }
};

// ============================== ÉTAT ==============================
const G = {
  scene:'menu', room:0, t:0, startStamp:0, playMs:0, hintsUsed:0,
  player:{x:512,y:540,tx:512,ty:540,dir:1,moving:false,pending:null,anim:0},
  flags:{}, inv:[], journal:[], fragments:[],
  dlg:[], dlgOpen:false, puzzle:null, fading:0, fadeDir:0, ended:false, hover:null
};
function saveGame(){
  try {
    localStorage.setItem('reveil_save', JSON.stringify({
      room:G.room, flags:G.flags, inv:G.inv, journal:G.journal, fragments:G.fragments,
      playMs:G.playMs, hintsUsed:G.hintsUsed, hintIdx:hintIdx
    }));
  } catch(e){}
}
function loadGame(){
  try {
    const s = JSON.parse(localStorage.getItem('reveil_save'));
    if(!s) return null;
    G.room=s.room; G.flags=s.flags; G.inv=s.inv||[]; G.journal=s.journal||[];
    G.fragments=s.fragments||[]; G.playMs=s.playMs||0; G.hintsUsed=s.hintsUsed||0;
    hintIdx=s.hintIdx||{};
    return true;
  } catch(e){ return null; }
}
const hasSave = function(){ try { return !!localStorage.getItem('reveil_save'); } catch(e){ return false; } }();

// ============================== UI DOM ==============================
function say(who, lines, after){
  G.dlgAfter = after||null;
  if(typeof lines === 'string') lines = [lines];
  for (const l of lines) G.dlg.push({who:who, txt:l});
  if(!G.dlgOpen) nextLine();
}
function nextLine(){
  const d = $('dialogue');
  const item = G.dlg.shift();
  if(!item){ G.dlgOpen=false; d.style.display='none'; const a=G.dlgAfter; G.dlgAfter=null; if(a) a(); return; }
  G.dlgOpen = true; d.style.display='block';
  d.querySelector('.who').textContent = item.who ? '— ' + item.who : '';
  d.querySelector('.txt').textContent = item.txt;
}
$('dialogue').addEventListener('click', nextLine);
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.style.display='block'; t.style.opacity=1;
  clearTimeout(toast._t); toast._t=setTimeout(function(){ t.style.opacity=0; setTimeout(function(){ t.style.display='none'; },500); }, 2800);
}
function addItem(icon,label){
  if(G.inv.indexOf(icon)>=0) return;
  G.inv.push(icon);
  const inv=$('inv'); inv.style.display='flex';
  const s=document.createElement('div'); s.className='slot';
  s.innerHTML = '<span>'+icon+'</span><div class="tip">'+label+'</div>';
  inv.appendChild(s); saveGame();
}
function jadd(txt){ G.journal.push(txt); renderJournal(); saveGame(); }
function jfrag(chif, roomName){
  if(G.fragments.indexOf(chif)>=0) return;
  G.fragments.push(chif);
  jadd(roomName+' — un chiffre gravé sur le chambranle : <span class="frag">'+chif+'</span>');
  toast('Fragment trouvé : '+chif+' (noté dans le journal)');
}
function renderJournal(){
  const ul=$('jlist'); ul.innerHTML='';
  if(!G.journal.length){ ul.innerHTML='<li style="border:none;color:#5a6172">Rien encore. Explore les lieux…</li>'; return; }
  G.journal.forEach(function(j){ const li=document.createElement('li'); li.innerHTML=j; ul.appendChild(li); });
}
$('btn-journal').onclick=function(){ $('journal').style.display = $('journal').style.display==='block'?'none':'block'; renderJournal(); };
$('journal').querySelector('.close').onclick=function(){ $('journal').style.display='none'; };
$('btn-sound').onclick=function(){ AU.on=!AU.on; $('btn-sound').textContent = AU.on?'🔊':'🔇'; if(AU.on) SND.click(); };

$('btn-hint').onclick=function(){
  const idx = G.room; const arr = HINTS[idx]||[]; if(!arr.length){ toast("Pas d'indice ici."); return; }
  const i = Math.min(hintIdx[idx]||0, arr.length-1);
  hintIdx[idx] = (hintIdx[idx]||0)+1; G.hintsUsed++;
  if(i===arr.length-1 && hintIdx[idx] > arr.length){ hintIdx[idx]=arr.length; }
  say('La voix derrière la vitre', [arr[Math.min(i, arr.length-1)]]);
  saveGame();
};

    else if(id==='door'){
      if(G.ended) return;
      PZ.keypad.open('La porte monumentale', 5, function(c){ return c===FINAL_CODE; }, function(){

      });

function pullBook(color){
  const F=G.flags; F.books = F.books||[];
  if(F.books.indexOf(color)>=0){ say('Toi',["Ce livre est déjà sorti de son rayon."]); return; }
  F.books.push(color); SND.click();
  const order=['vert','rouge','or','bleu'];
  const good = order.every(function(c,i){ return F.books[i]===c; });
  if(!good){ F.books=[]; SND.err();
    say('Toi',["Un contrepoids grinçe et remet tous les livres en place. Mauvais ordre…"]);
    return; }
  if(F.books.length===4){ SND.door(); F.doorOpen2=true; onRoomSolved(2);
    say('Toi',["Les quatre livres sortis dans l'ordre — un déclic traverse l'étagère entière.",
      "Un rayonnage pivote lentement : un passage ! Sur son bord, un « 1 » gravé."]);
  } else {
    say('Toi',["Le livre sort sans résistance. " + (4-F.books.length) + " autre(s) à trouver…"]);
  }
}
function onRoomSolved(r){ // r = index dans FRAG
  if(FRAG[r]){ jfrag(FRAG[r], ROOMS[r].nom); }
  saveGame();
}
function goRoom(r){
  if(G.room===r) return;
  G.fadeDir=1; G.fadeNext=r;
}
function enterRoom(r){
  G.room=r; G.player.x=140; G.player.y=540; G.player.tx=140; G.player.ty=540; G.player.pending=null;
  renderJournal();
  const intro = (G.flags['intro'+r] || r>=9) ? null : ROOMS[r].intro;
  if(!G.flags['intro'+r]){ G.flags['intro'+r]=true; }
  if(r===9 && !G.flags.intro9){ G.flags.intro9=true; intro=ROOMS[9].intro; }
  if(intro) setTimeout(function(){ say('', intro); }, 300);
  saveGame();
}
function finishGame(){
  SND.win(); G.ended=true; G.scene='end';
  try { localStorage.removeItem('reveil_save'); } catch(e){}
}

// ============================== PUZZLES ==============================
const PZ = {};
// ---- clavier numérique générique ----
PZ.keypad = {
  open:function(title, len, check, onOk){
    G.puzzle = { type:'keypad', title:title, len:len, buf:'', check:check, onOk:onOk, err:0 };
  },
  click:function(p){
    const pz=G.puzzle;
    const keys=this.layout();
    for (const k of keys){
      if(p.x>k.x && p.x<k.x+k.w && p.y>k.y && p.y<k.y+k.h){
        if(k.v==='C'){ pz.buf=''; SND.click(); }
        else if(k.v==='✓'){
          if(pz.check(pz.buf)){ SND.ok(); const cb=pz.onOk; G.puzzle=null; cb(); }
          else { pz.buf=''; pz.err=1; SND.err(); setTimeout(function(){ pz.err=0; },600); }
        }
        else if(pz.buf.length<pz.len){ pz.buf+=k.v; SND.click(); }
        return;
      }
    }
    if(p.y<130) { G.puzzle=null; } // fermer
  },
  layout:function(){
    const cx=512, y0=170, s=64, g=10, out=[];
    for(let r=0;r<4;r++) for(let c=0;c<3;c++){
      let v = (r<3) ? String(r*3+c+1) : (c===0?'C':(c===1?'0':'✓'));
      out.push({x:cx-1.5*s-g+c*(s+g), y:y0+r*(s+g), w:s, h:s, v:v});
    }
    return out;
  },
  draw:function(){
    const pz=G.puzzle, cx=512;
    ctx.fillStyle='rgba(0,0,0,0.65)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#10131c'; ctx.strokeStyle='#3a3f52'; ctx.lineWidth=2;
    rr(cx-160,60,320,470,10); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#9fb4d8'; ctx.font='18px Georgia'; ctx.textAlign='center';
    ctx.fillText(pz.title, cx, 95);
    ctx.fillStyle = pz.err? '#e06c6c' : '#7fd18a';
    ctx.font='34px "Courier New",monospace';
    const disp = (pz.buf + '_'.repeat(pz.len)).slice(0,pz.len);
    rr(cx-130,112,260,54,6); ctx.strokeStyle='#23283a'; ctx.stroke();
    ctx.fillText(disp.split('').join(' '), cx, 150);
    const keys=this.layout();
    keys.forEach(function(k){
      ctx.fillStyle = k.v==='✓' ? '#1d3325' : (k.v==='C' ? '#33201d' : '#1c2130');
      ctx.strokeStyle='#3a3f52'; rr(k.x,k.y,k.w,k.h,8); ctx.fill(); ctx.stroke();
      ctx.fillStyle = k.v==='✓' ? '#7fd18a' : (k.v==='C' ? '#e08c6c' : '#d8dcea');
      ctx.font='22px system-ui,sans-serif'; ctx.fillText(k.v, k.x+k.w/2, k.y+k.h/2+8);
    });
    ctx.fillStyle='#5a6172'; ctx.font='13px system-ui,sans-serif';
    ctx.fillText('clique sur ✕ en haut ou Échap pour fermer', cx, 545);
    ctx.textAlign='left';
  }
};
// ---- cadran à symboles (couloir) ----
PZ.sym = {
  SYMS:['lune','étoile','soleil','arbre','feu','œil'],
  open:function(check){ G.puzzle={type:'sym', sel:[null,null,null], check:check, active:0}; },
  click:function(p){
    const pz=G.puzzle;
    if(p.y<130 || p.y>540){ G.puzzle=null; return; }
    const cx=512;
    // slots
    for(let i=0;i<3;i++){
      const sx=cx-190+i*150;
      if(p.x>=sx&&p.x<=sx+110&&p.y>=200&&p.y<=310){
        pz.active=i; pz.choicesOpen=true; SND.click(); return;
      }
    }
    // panneau de choix
    if(pz.choicesOpen){
      const gx=cx-255, gy=340, s=170;
      for(let i=0;i<6;i++){
        const x=gx+(i%3)*(s/2+10), y=gy+Math.floor(i/3)*100;
        if(p.x>=x&&p.x<=x+s/2&&p.y>=y&&p.y<=y+90){
          pz.sel[pz.active]=this.SYMS[i]; pz.choicesOpen=false; SND.click();
          if(pz.sel.every(function(s){return s;}) && pz.check(pz.sel)) { G.puzzle=null; }
          return;
        }
      }
    }
  },
  drawGlyph:function(name,x,y,s){
    ctx.strokeStyle='#d8b46a'; ctx.fillStyle='#d8b46a'; ctx.lineWidth=3;
    if(name==='lune'){ ctx.beginPath(); ctx.arc(x,y,s*0.4,0.5,Math.PI*1.8); ctx.stroke(); }
    else if(name==='étoile'){ ctx.beginPath(); for(let i=0;i<5;i++){ const a=-Math.PI/2+i*2*Math.PI/5; const a2=a+Math.PI/5;
      ctx.lineTo(x+Math.cos(a)*s*0.42,y+Math.sin(a)*s*0.42); ctx.lineTo(x+Math.cos(a2)*s*0.18,y+Math.sin(a2)*s*0.18);} ctx.closePath(); ctx.fill(); }
    else if(name==='soleil'){ ctx.beginPath(); ctx.arc(x,y,s*0.26,0,Math.PI*2); ctx.fill();
      for(let i=0;i<8;i++){ const a=i*Math.PI/4; ctx.beginPath(); ctx.moveTo(x+Math.cos(a)*s*0.34,y+Math.sin(a)*s*0.34);
        ctx.lineTo(x+Math.cos(a)*s*0.46,y+Math.sin(a)*s*0.46); ctx.stroke(); } }
    else if(name==='arbre'){ ctx.beginPath(); ctx.moveTo(x,y+s*0.4); ctx.lineTo(x,y);
      ctx.moveTo(x-s*0.2,y+s*0.05); ctx.lineTo(x,y-s*0.3); ctx.lineTo(x+s*0.2,y+s*0.05); ctx.stroke(); }
    else if(name==='feu'){ ctx.beginPath(); ctx.moveTo(x,y-s*0.35);
      ctx.quadraticCurveTo(x-s*0.3,y+ s*0.1,x,y+s*0.35); ctx.quadraticCurveTo(x+s*0.3,y+s*0.1,x,y-s*0.35); ctx.stroke(); }
    else if(name==='œil'){ ctx.beginPath(); ctx.moveTo(x-s*0.4,y); ctx.quadraticCurveTo(x,y-s*0.35,x+s*0.4,y);
      ctx.quadraticCurveTo(x,y+s*0.35,x-s*0.4,y); ctx.stroke(); ctx.beginPath(); ctx.arc(x,y,s*0.1,0,Math.PI*2); ctx.fill(); }
  },
  draw:function(){
    const pz=G.puzzle, cx=512;
    ctx.fillStyle='rgba(0,0,0,0.65)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#10131c'; ctx.strokeStyle='#3a3f52'; ctx.lineWidth=2;
    rr(cx-300,60,600,500,10); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#9fb4d8'; ctx.font='19px Georgia'; ctx.textAlign='center';
    ctx.fillText('Le cadran de la porte — « la nuit précède l\u2019aube »', cx, 95);
    for(let i=0;i<3;i++){
      const sx=cx-190+i*150;
      ctx.fillStyle = pz.active===i ? '#2a3145' : '#161a26';
      ctx.strokeStyle = pz.sel[i]? '#d8b46a':'#3a3f52';
      rr(sx,200,110,110,8); ctx.fill(); ctx.stroke();
      if(pz.sel[i]) this.drawGlyph(pz.sel[i], sx+55, 255, 90);
    }
    if(pz.choicesOpen){
      const gx=cx-255, gy=340, s=170;
      for(let i=0;i<6;i++){
        const x=gx+(i%3)*(s/2+10), y=gy+Math.floor(i/3)*100;

// ============================== JOUEUR ==============================
function drawPlayer(){
  const p=G.player;
  const bob = p.moving? Math.sin(G.t/6)*3 : Math.sin(G.t/30)*1.5;
  const x=p.x, y=p.y+bob;
  // ombre
  ctx.fillStyle='rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(p.x,p.y+52,26,7,0,0,Math.PI*2); ctx.fill();
  // jambes
  const step = p.moving? Math.sin(G.t/6)*10 : 0;
  ctx.strokeStyle='#2c3140'; ctx.lineWidth=11; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x-9,y+22); ctx.lineTo(x-9-step,y+52);
  ctx.moveTo(x+9,y+22); ctx.lineTo(x+9+step,y+52); ctx.stroke();
  // torse
  ctx.fillStyle='#454b5e'; rr(x-22,y-18,44,44,12); ctx.fill();
  // bras
  ctx.beginPath(); ctx.moveTo(x-18,y-10); ctx.lineTo(x-26-step*0.4,y+16);
  ctx.moveTo(x+18,y-10); ctx.lineTo(x+26+step*0.4,y+16); ctx.stroke();
  // tête
  ctx.fillStyle='#c9a188'; ctx.beginPath(); ctx.arc(x,y-34,18,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#241d18'; ctx.beginPath(); ctx.arc(x,y-42,19,Math.PI*0.95,Math.PI*2.15);
  ctx.quadraticCurveTo(x+16,y-48,x+4,y-52);
  ctx.quadraticCurveTo(x-14,y-54,x-19,y-40); ctx.closePath(); ctx.fill();
  // yeux (direction)
  const ex = p.dir*3;
  ctx.fillStyle='#f4efe9';
  ctx.beginPath(); ctx.ellipse(x-6+ex,y-34,4,3,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+6+ex,y-34,4,3,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#20242e';
  ctx.beginPath(); ctx.arc(x-6+ex,y-34,2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+6+ex,y-34,2,0,Math.PI*2); ctx.fill();
}
function updatePlayer(){
  const p=G.player;
  const dx=p.tx-p.x, dy=p.ty-p.y, dist=Math.hypot(dx,dy);
  if(dist>4){
    p.moving=true;
    const sp=Math.min(3.4,dist);
    p.x+=dx/dist*sp; p.y+=dy/dist*sp;
    p.dir = dx>0?1:(dx<0?-1:p.dir);
    if(G.t%9===0) SND.step();
  } else {
    p.moving=false;
    if(p.pending){ const act=p.pending; p.pending=null; interact(act); }
  }
  p.y=clamp(p.y,FLOOR_TOP+40,H-30);
  p.x=clamp(p.x,40,W-40);
}
// curseur + clic
function stagePos(e){
  const r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)*(W/r.width), y:(e.clientY-r.top)*(H/r.height)};
}
cv.addEventListener('mousemove', function(e){
  if(G.scene!=='game'||G.puzzle) return;
  const p=stagePos(e); const h=hitAt(p);
  cv.style.cursor = (h||(p.y>FLOOR_TOP))? 'pointer':'default';
  G.hover = h? h.label : (p.y>FLOOR_TOP? '':null);
});
cv.addEventListener('click', function(e){
  if(G.scene==='menu'||G.scene==='end') return;
  if(G.dlgOpen){ nextLine(); return; }
  const p=stagePos(e);
  if(G.puzzle){
    const pz=G.puzzle;
    PZ[pz.type] && PZ[pz.type].click && PZ[pz.type].click(p);
    return;
  }
  const h=hitAt(p);
  if(h){
    // marche vers le point d'ancrage puis interagit
    G.player.tx=h.ax; G.player.ty=h.ay; G.player.pending=h.id;
    SND.click();
  } else if(p.y>FLOOR_TOP){
    G.player.tx=p.x; G.player.ty=p.y; G.player.pending=null;
  }
});
function hitAt(p){
  const hs=hotspots();
  for(let i=hs.length-1;i>=0;i--){
    const h=hs[i];
    if(p.x>=h.x&&p.x<=h.x+h.w&&p.y>=h.y&&p.y<=h.y+h.h) return h;
  }
  return null;
}

// ============================== SCÈNES ==============================
function drawMenu(){
  ctx.fillStyle='#05060a'; ctx.fillRect(0,0,W,H);
  // pièce floue en fond
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0c0e16'); g.addColorStop(1,'#141420');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#1a1620'; ctx.fillRect(0,470,W,170);
  // fenêtre avec silhouette
  ctx.fillStyle='#0a0d14'; rr(140,120,200,240,6); ctx.fill();
  ctx.strokeStyle='#2a3040'; ctx.lineWidth=6; rr(140,120,200,240,6); ctx.stroke();
  const sway=Math.sin(G.t/60);
  silhouette(ctx, 240+sway*6, 240, 200);
  ctx.fillStyle='rgba(220,225,240,0.8)';
  ctx.beginPath(); ctx.arc(232+sway*6,228,3.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(248+sway*6,228,3.5,0,Math.PI*2); ctx.fill();
  // lampe
  drawLamp(700,120,'rgba(255,228,160,0.10)',Math.sin(G.t/70)*6);
  drawVignette();
  // poussière
  for(let i=0;i<24;i++){
    const px=(i*173+G.t*0.3)%W, py=(i*97+Math.sin((G.t+i*40)/80)*30+100)%H;
    ctx.fillStyle='rgba(200,210,230,0.07)';
    ctx.beginPath(); ctx.arc(px,py,1.4,0,Math.PI*2); ctx.fill();
  }
}
function drawEnd(){
  ctx.fillStyle='#05060a'; ctx.fillRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0c0e16'); g.addColorStop(1,'#1a1c28');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // grande silhouette de face, souriante
  silhouette(ctx, 512, 300, 420, {col:'rgba(14,16,22,0.95)'});
  ctx.strokeStyle='rgba(220,225,240,0.7)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(512,320,26,0.3,Math.PI-0.3); ctx.stroke();
  ctx.fillStyle='rgba(220,225,240,0.8)';
  ctx.beginPath(); ctx.arc(495,270,4,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(529,270,4,0,Math.PI*2); ctx.fill();
  // texte
  const mins=Math.floor(G.playMs/60000), secs=Math.floor(G.playMs/1000)%60;
  ctx.fillStyle='#e6e9f2'; ctx.font='34px Georgia'; ctx.textAlign='center';
  ctx.fillText('LA DERNIÈRE PORTE S\u2019EST OUVERTE.', 512, 430);
  ctx.fillStyle='#9fb4d8'; ctx.font='19px Georgia';
  ctx.fillText('La silhouette t\u2019attendait derrière. Elle a posé une main sur ton épaule,', 512, 470);
  ctx.fillText('et a murmuré : « Je t\u2019ai enfermé pour t\u2019apprendre à sortir. Va, maintenant. »', 512, 496);
  ctx.fillStyle='#7a8298'; ctx.font='16px system-ui,sans-serif';
  ctx.fillText('Temps de l\u2019évasion : '+mins+' min '+(secs<10?'0':'')+secs+' s   ·   Indices utilisés : '+G.hintsUsed, 512, 540);
  ctx.fillStyle='#d8b46a'; ctx.font='20px Georgia';
  ctx.fillText('— FIN —', 512, 580);
  ctx.fillStyle='#5a6172'; ctx.font='14px system-ui,sans-serif';
  ctx.fillText('(Drasah : une suite ? dix nouvelles portes t\u2019attendent quand tu veux…)', 512, 612);
  ctx.textAlign='left';
}

// ============================== HUD ==============================
function drawHud(){
  ctx.fillStyle='rgba(216,220,234,0.4)'; ctx.font='15px Georgia';
  ctx.fillText(ROOMS[G.room].nom.toUpperCase()+'   —   porte '+(G.room+1)+'/10', 18, H-16);
  if(G.hover){
    ctx.fillStyle='rgba(10,12,18,0.85)';
    const tw=ctx.measureText(G.hover).width;
    rr(G.player.x-tw/2-10, G.player.y-96, tw+20, 26, 5); ctx.fill();
    ctx.strokeStyle='#3a3f52'; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle='#d8dcea'; ctx.font='13px system-ui,sans-serif'; ctx.textAlign='center';
    ctx.fillText(G.hover, G.player.x, G.player.y-78); ctx.textAlign='left';
  }
}

// ============================== MENU DOM ==============================
$('btn-new').onclick=function(){
  try{ localStorage.removeItem('reveil_save'); }catch(e){}
  G.flags={}; G.inv=[]; G.journal=[]; G.fragments=[]; G.hintsUsed=0; G.playMs=0; hintIdx={};
  startGame(0);
};
$('btn-continue').onclick=function(){ if(loadGame()) startGame(G.room); };
$('btn-help').onclick=function(){
  say('', ["BUT : traverse les 10 pièces et ouvre chaque porte.",
    "Clique au sol : tu marches. Clique un objet lumineux : tu t'en approches et tu l'examines.",
    "J : ton journal (notes, codes, fragments). 💡 : un indice si tu bloques.",
    "Ta progression est sauvegardée automatiquement. Bonne évasion."]);
};
if(hasSave){ $('btn-continue').style.display='block'; }
function startGame(r){
  G.scene='game'; G.startStamp=Date.now()-G.playMs;
  $('menu-dom').style.display='none';
  $('hud').style.display='flex'; $('inv').style.display='flex';
  if(G.inv.length===0) $('inv').style.display='none';
  G.inv.forEach(function(ic){ addItem(ic,''); }); // re-rend les slots
  enterRoom(r);
  SND.ok();
}

// ============================== BOUCLE ==============================
function frame(){
  G.t++;
  ctx.clearRect(0,0,W,H);
  if(G.scene==='menu'){ drawMenu(); }
  else if(G.scene==='end'){ drawEnd(); }
  else {
    if(G.playMs===0 && G.startStamp) G.playMs=0;
    G.playMs = Date.now()-G.startStamp;
    drawShell(ROOMS[G.room].pal);
    (DECOR[G.room]||function(){})();
    updatePlayer();
    drawPlayer();
    drawVignette();
    drawHud();
    // sauvegarde du temps toutes les ~10 s
    if(G.t%600===0) saveGame();
  }
  if(G.puzzle){ PZ[G.puzzle.type].draw(); }
  // fondu de transition
  if(G.fadeDir===1){
    G.fading=Math.min(1,G.fading+0.06);
    if(G.fading>=1){ G.fadeDir=-1; enterRoom(G.fadeNext); }
  } else if(G.fadeDir===-1){
    G.fading=Math.max(0,G.fading-0.06);
    if(G.fading<=0) G.fadeDir=0;
  }
  if(G.fading>0){
    ctx.fillStyle='rgba(0,0,0,'+G.fading+')'; ctx.fillRect(0,0,W,H);
  }
  requestAnimationFrame(frame);
}
frame();
// nettoie une éventuelle sauvegarde de fin
if(G.ended){ G.scene='menu'; }
})();
