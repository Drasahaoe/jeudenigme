
<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Réveil — Jeu d'Énigme</title>
<style>
  :root { font-family: Georgia, 'Times New Roman', serif; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #060608; overflow: hidden; }
  #wrap { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; width: 960px; height: 600px; max-width: 100vw; max-height: 100vh; aspect-ratio: 16/10; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
  #dialogue {
    position: absolute; left: 4%; right: 4%; bottom: 3%;
    min-height: 74px; padding: 12px 18px;
    background: rgba(8, 10, 14, 0.92); border: 1px solid #3a3f52; border-radius: 8px;
    color: #d8dcea; font-size: 17px; line-height: 1.45;
    box-shadow: 0 4px 18px rgba(0,0,0,0.6);
    display: none;
  }
  #dialogue .who { color: #9fb4d8; font-style: italic; font-size: 14px; margin-bottom: 4px; }
  #dialogue .hint { position: absolute; right: 14px; bottom: 6px; color: #5a6172; font-size: 12px; font-family: system-ui, sans-serif; }
  #intro {
    position: absolute; inset: 0; background: #000; color: #cfd6e4;
    display: flex; align-items: center; justify-content: center; text-align: center;
    font-size: 26px; letter-spacing: 1px; cursor: pointer;
    transition: opacity 1.2s ease; z-index: 5;
  }
  #intro .sub { display: block; margin-top: 14px; font-size: 15px; color: #5a6172; font-family: system-ui, sans-serif; }
  #keypad {
    position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%);
    background: #10131c; border: 1px solid #3a3f52; border-radius: 10px;
    padding: 18px 20px; display: none; z-index: 4; text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.7);
  }
  #keypad .disp {
    font-family: 'Courier New', monospace; font-size: 30px; letter-spacing: 12px;
    background: #06080d; border: 1px solid #23283a; color: #7fd18a;
    padding: 8px 10px 8px 20px; border-radius: 4px; margin-bottom: 12px; min-width: 190px;
  }
  #keypad .disp.err { color: #e06c6c; }
  #keypad table { margin: 0 auto; border-spacing: 6px; }
  #keypad button {
    width: 52px; height: 44px; font-size: 20px; font-family: system-ui, sans-serif;
    background: #1c2130; color: #d8dcea; border: 1px solid #3a3f52; border-radius: 6px; cursor: pointer;
  }
  #keypad button:hover { background: #2a3145; }
  #keypad .close { margin-top: 10px; font-size: 13px; color: #5a6172; background: none; border: none; cursor: pointer; width: auto; height: auto; }
  #inv {
    position: absolute; top: 3%; right: 3%; display: none; gap: 8px; z-index: 3;
  }
  .slot {
    width: 46px; height: 46px; border: 1px dashed #4a5166; border-radius: 6px;
    background: rgba(10,12,18,0.8); color: #9fb4d8; font-size: 26px; text-align: center; line-height: 44px;
  }
  #toast {
    position: absolute; top: 3%; left: 50%; transform: translateX(-50%);
    background: rgba(20,24,34,0.95); border: 1px solid #3a3f52; color: #d8dcea;
    padding: 8px 16px; border-radius: 6px; font-size: 15px; display: none; z-index: 6;
    font-family: system-ui, sans-serif;
  }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv" width="960" height="600"></canvas>
  <div id="intro"><div>« Où... où suis-je ? »<span class="sub">Clique pour te réveiller</span></div></div>
  <div id="dialogue"><div class="who"></div><div class="txt"></div><div class="hint">clique pour continuer</div></div>
  <div id="keypad"></div>
  <div id="inv"></div>
  <div id="toast"></div>
</div></div>

<script>
(function () {
  "use strict";
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const W = 960, H = 600;

  // ---------- État ----------
  const S = {
    awake: false,          // le personnage s'est réveillé (intro faite)
    wakeAnim: 0,           // 0..1 animation de réveil
    lookedSelf: 0,         // nb de fois qu'on s'examine
    doorTries: 0,
    windowSeen: 0,         // 0 jamais, 1 silhouette vue, 2 elle se cache, 3 œil qui regarde
    noteFound: false,
    doorOpen: false,
    ended: false,
    time: 0
  };
  const CODE = "2049";
  const queue = [];        // file de dialogues
  let talking = false;

  // ---------- Utilitaires ----------
  function $(id) { return document.getElementById(id); }
  function say(who, lines) {
    for (const l of lines) queue.push({ who: who, txt: l });
    if (!talking) nextLine();
  }
  function nextLine() {
    const d = $('dialogue');
    const item = queue.shift();
    if (!item) { talking = false; d.style.display = 'none'; return; }
    talking = true;
    d.style.display = 'block';
    d.querySelector('.who').textContent = item.who ? '— ' + item.who : '';
    d.querySelector('.txt').textContent = item.txt;
  }
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.style.display = 'block';
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.style.display = 'none'; }, 2600);
  }
  function addItem(label) {
    const inv = $('inv');
    inv.style.display = 'flex';
    const s = document.createElement('div');
    s.className = 'slot'; s.title = 'Note trouvée sous le coussin';
    s.textContent = label;
    inv.appendChild(s);
  }

  // ---------- Hotspots ----------
  const hotspots = [
    { id: 'chair',  x: 300, y: 330, w: 210, h: 230, label: 'La chaise' },
    { id: 'self',   x: 330, y: 190, w: 150, h: 150, label: 'Toi' },
    { id: 'window', x: 60,  y: 130, w: 170, h: 200, label: 'La vitre' },
    { id: 'door',   x: 700, y: 110, w: 170, h: 330, label: 'La porte' },
    { id: 'floor',  x: 380, y: 520, w: 220, h: 60,  label: 'Le sol' }
  ];

  function interact(id) {
    if (!S.awake) return;
    if (talking) { nextLine(); return; }

    if (id === 'self') {
      S.lookedSelf++;
      if (S.lookedSelf === 1) {
        say('Toi', [
          'Ma tête... Je ne me souviens de rien. Comment je suis arrivé ici ?',
          'Cette pièce... il n\'y a qu\'une porte et cette vitre bizarre. Et... j\'ai l\'impression qu\'on m\'observe.'
        ]);
      } else if (S.lookedSelf === 2) {
        say('Toi', ['Mes poches sont vides. Quelqu\'un a fouillé mes affaires...']);
      } else {
        say('Toi', ['Il faut que je trouve un moyen de sortir d\'ici.']);
      }
    }

    else if (id === 'window') {
      S.windowSeen++;
      if (S.windowSeen === 1) {
        say('???', ['...'], );
        setTimeout(function () {
          say('Toi', [
            'Une silhouette ! Derrière la vitre ! Elle nous regardait !',
            'Elle s\'est cachée dès que je me suis levé... Qui est-ce ?'
          ]);
        }, 600);
      } else if (S.windowSeen === 2) {
        say('Toi', ['Rien. Elle s\'est vraiment esquivée. La vitre ne s\'ouvre pas de ce côté...']);
      } else if (S.windowSeen === 3) {
        say('???', ['...']);
        setTimeout(function () {
          say('Toi', ['Un œil ! Un œil dans l\'ombre qui me fixe ! Reste là... je te retrouverai !']);
        }, 500);
      } else {
        say('Toi', ['L\'œil a disparu. Cette vitre me glace le sang.']);
      }
    }

    else if (id === 'door') {
      if (S.doorOpen) { say('Toi', ['La porte est ouverte. La suite m\'attend...']); return; }
      S.doorTries++;
      if (S.doorTries === 1) {
        say('Toi', [
          'Verrouillée, évidemment. Il y a un petit clavier numérique à côté. 4 chiffres.',
          'Il me faut un code... fouillons cette pièce, il doit être caché quelque part.'
        ]);
      } else {
        openKeypad();
      }
    }

    else if (id === 'chair') {
      if (!S.noteFound) {
        S.noteFound = true;
        addItem(' Scribble ');
        say('Toi', [
          'Il y a quelque chose coincé sous le coussin... un bout de papier froissé.',
          'Des chiffres griffonnés : « 2 0 4 9 ». Ça sent le code de la porte...'
        ]);
        toast('Note obtenue : 2 0 4 9');
      } else {
        say('Toi', ['Une simple chaise de bois. Le coussin a livré son secret.']);
      }
    }

    else if (id === 'floor') {
      say('Toi', ['Le sol est Poussiéreux... des traces de pas partent de la chaise. Les miennes ? Non... elles sont plus grandes.']);
    }
  }

  // ---------- Clavier ----------
  const kp = $('keypad');
  function buildKeypad() {
    let html = '<div class="disp" id="kdisp">____</div><table>';
    const keys = ['1','2','3','4','5','6','7','8','9','C','0','✓'];
    for (let r = 0; r < 4; r++) {
      html += '<tr>';
      for (let c = 0; c < 3; c++) {
        const k = keys[r * 3 + c];
        html += '<td><button data-k="' + k + '">' + k + '</button></td>';
      }
      html += '</tr>';
    }
    html += '</table><button class="close" id="kclose">fermer (Échap)</button>';
    kp.innerHTML = html;
    kp.querySelectorAll('button[data-k]').forEach(function (b) {
      b.addEventListener('click', function (e) { e.stopPropagation(); pressKey(b.dataset.k); });
    });
    $('kclose').addEventListener('click', function (e) { e.stopPropagation(); closeKeypad(); });
  }
  let kbuf = '';
  function openKeypad() { buildKeypad(); kbuf = ''; updDisp(); kp.style.display = 'block'; }
  function closeKeypad() { kp.style.display = 'none'; }
  function updDisp(err) {
    const d = $('kdisp');
    d.textContent = (kbuf + '____').slice(0, 4);
    d.classList.toggle('err', !!err);
  }
  function pressKey(k) {
    if (k === 'C') { kbuf = ''; updDisp(); return; }
    if (k === '✓') {
      if (kbuf === CODE) {
        closeKeypad();
        S.doorOpen = true;
        say('Toi', [
          '*BIP* Le verrou saute ! La porte s\'entrouvre sur un couloir sombre...',
          'Une dernière chose : l\'ombre derrière la vitre. Elle sait quelque chose. Et moi aussi, maintenant : je vais la découvrir.'
        ]);
        setTimeout(function () { endDemo(); }, 1200);
      } else {
        kbuf = ''; updDisp(true);
        toast('Code incorrect');
        setTimeout(function () { updDisp(); }, 700);
      }
      return;
    }
    if (kbuf.length < 4) { kbuf += k; updDisp(); }
  }
  document.addEventListener('keydown', function (e) {
    if (kp.style.display === 'block') {
      if (e.key === 'Escape') closeKeypad();
      if (/^[0-9]$/.test(e.key)) pressKey(e.key);
      if (e.key === 'Enter') pressKey('✓');
      if (e.key === 'Backspace') pressKey('C');
    } else if (talking && (e.key === ' ' || e.key === 'Enter')) {
      nextLine();
    }
  });

  function endDemo() {
    S.ended = true;
    say('', ['— FIN DE LA DÉMO —', 'La suite de l\'aventure arrive bientôt... Drasah y travaille. 😉']);
  }

  // ---------- Souris ----------
  function stagePos(e) {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
  }
  function hitAt(p) {
    // ordre inverse : éléments "devant" d'abord
    for (let i = hotspots.length - 1; i >= 0; i--) {
      const h = hotspots[i];
      if (p.x >= h.x && p.x <= h.x + h.w && p.y >= h.y && p.y <= h.y + h.h) return h;
    }
    return null;
  }
  cv.addEventListener('mousemove', function (e) {
    if (!S.awake) return;
    cv.style.cursor = hitAt(stagePos(e)) ? 'pointer' : 'default';
  });
  cv.addEventListener('click', function (e) {
    if (!S.awake) return;
    if (kp.style.display === 'block') return;
    if (talking) { nextLine(); return; }
    const h = hitAt(stagePos(e));
    if (h) interact(h.id);
  });
  $('dialogue').addEventListener('click', function () { if (talking) nextLine(); });

  // ---------- Intro ----------
  $('intro').addEventListener('click', function () {
    if (S.awake) return;
    const el = $('intro');
    el.style.opacity = '0';
    setTimeout(function () { el.style.display = 'none'; }, 1200);
    S.awake = true;
    S.wakeAnim = 0.001; // démarre l'animation
    setTimeout(function () {
      say('Toi', [
        'Aïe... ma nuque. Où suis-je ? Cette chaise... ce plafond...',
        'Une pièce fermée. Une porte, une vitre. Et... ce sentiment d\'être attendu.',
        'Fouille la pièce : clique sur ce qui t\'intrigue.'
      ]);
    }, 1400);
  });

  // ---------- Rendu ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawRoom() {
    // fond mur
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#171a22');
    g.addColorStop(0.7, '#232733');
    g.addColorStop(1, '#1a1d26');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // papier peint défraîchi (lignes)
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let x = 40; x < W; x += 60) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x - 30, 460); ctx.stroke();
    }

    // sol
    ctx.fillStyle = '#2e2a24';
    ctx.beginPath();
    ctx.moveTo(0, 460); ctx.lineTo(W, 460); ctx.lineTo(W, H); ctx.lineTo(0, H);
    ctx.closePath(); ctx.fill();
    // lattes
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    for (let i = 0; i < 12; i++) {
      ctx.beginPath(); ctx.moveTo(i * 90 - 40, H); ctx.lineTo(i * 110 + 60, 460); ctx.stroke();
    }
    // tapis sous la chaise
    ctx.fillStyle = 'rgba(90,60,50,0.35)';
    ctx.beginPath(); ctx.ellipse(405, 545, 190, 42, 0, 0, Math.PI * 2); ctx.fill();

    // plafonnateur : lampe suspendue
    ctx.strokeStyle = '#0d0f14'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, 70); ctx.stroke();
    const sway = Math.sin(S.time / 60) * 4;
    // cône de lumière
    const lg = ctx.createRadialGradient(W / 2 + sway, 100, 10, W / 2, 300, 480);
    lg.addColorStop(0, 'rgba(255,228,160,0.30)');
    lg.addColorStop(0.4, 'rgba(255,228,160,0.08)');
    lg.addColorStop(1, 'rgba(255,228,160,0)');
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.moveTo(W / 2 + sway - 14, 96);
    ctx.lineTo(W / 2 + sway + 14, 96);
    ctx.lineTo(W / 2 + 320, 470);
    ctx.lineTo(W / 2 - 320, 470);
    ctx.closePath(); ctx.fill();
    // ampoule
    ctx.fillStyle = '#ffe8a0';
    ctx.beginPath(); ctx.arc(W / 2 + sway, 92, 11, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#c9a44c';
    ctx.fillRect(W / 2 + sway - 8, 82, 16, 6);
  }

  function drawWindow() {
    const x = 60, y = 130, w = 170, h = 200;
    // vitre : reflet sombre
    ctx.fillStyle = '#0a0d14';
    roundRect(x, y, w, h, 6); ctx.fill();
    ctx.strokeStyle = '#3d4356'; ctx.lineWidth = 7;
    roundRect(x, y, w, h, 6); ctx.stroke();
    // croisillon
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(x + w / 2, y + 4); ctx.lineTo(x + w / 2, y + h - 4);
    ctx.moveTo(x + 4, y + h / 2); ctx.lineTo(x + w - 4, y + h / 2);
    ctx.stroke();
    // reflets
    ctx.strokeStyle = 'rgba(160,180,220,0.10)'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(x + 18, y + h - 20); ctx.lineTo(x + w - 40, y + 18); ctx.stroke();

    // ce qu'on voit derrière
    if (S.windowSeen === 1) {
      // silhouette qui se cache (demi-visible, penchée)
      ctx.fillStyle = 'rgba(5,6,9,0.95)';
      ctx.beginPath();
      ctx.ellipse(x + w / 2 + 30, y + h - 30, 42, 60, 0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath(); ctx.arc(x + w / 2 + 44, y + h - 78, 22, 0, Math.PI * 2); ctx.fill();
    } else if (S.windowSeen === 2) {
      // rien : vide
    } else if (S.windowSeen >= 3) {
      // l'œil dans l'ombre
      const eyeOpen = 0.5 + 0.5 * Math.sin(S.time / 18);
      ctx.fillStyle = 'rgba(4,5,8,0.98)';
      ctx.beginPath(); ctx.ellipse(x + w / 2, y + h / 2 + 20, 70, 78, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#dfe6f2';
      ctx.beginPath();
      ctx.ellipse(x + w / 2, y + h / 2 + 10, 18, 9 * (0.6 + 0.4 * eyeOpen), 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#1c2740';
      ctx.beginPath(); ctx.arc(x + w / 2, y + h / 2 + 10, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#0a0d14';
      ctx.beginPath(); ctx.arc(x + w / 2, y + h / 2 + 10, 2.5, 0, Math.PI * 2); ctx.fill();
    } else {
      // avant de l'avoir vue : une présence à peine suggérée
      ctx.fillStyle = 'rgba(6,8,12,0.7)';
      ctx.beginPath(); ctx.ellipse(x + w / 2 - 26, y + h / 2 + 10, 34, 52, 0.08, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawDoor() {
    const x = 700, y = 110, w = 170, h = 350;
    if (S.doorOpen) {
      // porte entrouverte sur le noir
      ctx.fillStyle = '#020204';
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = '#3d4356'; ctx.lineWidth = 6;
      ctx.strokeRect(x, y, w, h);
      // liseré de lumière du couloir
      const clg = ctx.createLinearGradient(x - 40, 0, x + 10, 0);
      clg.addColorStop(0, 'rgba(255,220,150,0)');
      clg.addColorStop(1, 'rgba(255,220,150,0.18)');
      ctx.fillStyle = clg;
      ctx.fillRect(x - 40, y, 50, h);
      // vantail ouvert
      ctx.fillStyle = '#33303f';
      ctx.save();
      ctx.translate(x, y);
      ctx.transform(0.35, 0, 0.12, 1, 0, 0);
      ctx.fillRect(0, 0, w, h);
      ctx.restore();
      return;
    }
    // cadre
    ctx.strokeStyle = '#3d4356'; ctx.lineWidth = 8;
    ctx.strokeRect(x, y, w, h);
    // porte
    const dg = ctx.createLinearGradient(x, 0, x + w, 0);
    dg.addColorStop(0, '#2a2e3d');
    dg.addColorStop(0.5, '#383d4f');
    dg.addColorStop(1, '#252936');
    ctx.fillStyle = dg;
    ctx.fillRect(x + 4, y + 4, w - 8, h - 8);
    // panneaux
    ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 3;
    roundRect(x + 26, y + 30, w - 52, 120, 4); ctx.stroke();
    roundRect(x + 26, y + 180, w - 52, 130, 4); ctx.stroke();
    // poignée
    ctx.fillStyle = '#8a8f9e';
    ctx.beginPath(); ctx.arc(x + w - 30, y + h / 2, 7, 0, Math.PI * 2); ctx.fill();
    // clavier numérique
    ctx.fillStyle = '#141822';
    roundRect(x - 46, y + 120, 36, 60, 4); ctx.fill();
    ctx.strokeStyle = '#454c62'; ctx.lineWidth = 2;
    roundRect(x - 46, y + 120, 36, 60, 4); ctx.stroke();
    ctx.fillStyle = '#7fd18a';
    ctx.fillRect(x - 40, y + 126, 24, 10);
    ctx.fillStyle = '#3a4154';
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
      ctx.fillRect(x - 41 + c * 10, y + 142 + r * 12, 7, 8);
    }
  }

  function drawChair() {
    const cx = 405, cy = 545;
    // chaise de bois : pieds
    ctx.strokeStyle = '#4a3826'; ctx.lineWidth = 9;
    ctx.beginPath();
    ctx.moveTo(cx - 60, cy); ctx.lineTo(cx - 78, cy - 170);
    ctx.moveTo(cx + 60, cy); ctx.lineTo(cx + 78, cy - 170);
    ctx.moveTo(cx - 48, cy - 110); ctx.lineTo(cx + 48, cy - 110);
    ctx.stroke();
    // assise
    ctx.fillStyle = '#5c452e';
    roundRect(cx - 66, cy - 178, 132, 26, 6); ctx.fill();
    // coussin (avec bosse si note pas trouvée ? non, invisible)
    ctx.fillStyle = '#7a4a42';
    roundRect(cx - 56, cy - 188, 112, 22, 8); ctx.fill();
    // dossier
    ctx.strokeStyle = '#4a3826'; ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.moveTo(cx - 62, cy - 176); ctx.lineTo(cx - 54, cy - 320);
    ctx.moveTo(cx + 62, cy - 176); ctx.lineTo(cx + 54, cy - 320);
    ctx.stroke();
    ctx.fillStyle = '#5c452e';
    roundRect(cx - 56, cy - 322, 112, 40, 6); ctx.fill();
    // taches d'ombre
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    roundRect(cx - 66, cy - 158, 132, 8, 3); ctx.fill();
  }

  function drawSelf() {
    const cx = 405;
    const lift = S.wakeAnim;      // 0 assis endormi → 1 debout face caméra
    const sitY = 335;             // position tête assis
    const standY = 175;
    const headY = sitY + (standY - sitY) * lift;
    const lean = (1 - lift) * 0.35; // inclinaison quand endormi

    ctx.save();
    ctx.translate(cx, 0);
    ctx.rotate(0);

    // corps
    ctx.save();
    ctx.translate(0, headY + 60);
    ctx.rotate(lean * 0.5);
    // torse
    ctx.fillStyle = '#454b5e';
    roundRect(-46, 0, 92, 130, 18); ctx.fill();
    ctx.restore();

    // bras : pendouillent quand endormi, croisés quand debout
    ctx.strokeStyle = '#454b5e'; ctx.lineWidth = 18; ctx.lineCap = 'round';
    if (lift < 0.9) {
      ctx.beginPath();
      ctx.moveTo(-38, headY + 80); ctx.lineTo(-52, headY + 180);
      ctx.moveTo(38, headY + 80); ctx.lineTo(52, headY + 180);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(-38, headY + 80); ctx.lineTo(-16, headY + 150); ctx.lineTo(16, headY + 138);
      ctx.moveTo(38, headY + 80); ctx.lineTo(18, headY + 150); ctx.lineTo(-12, headY + 142);
      ctx.stroke();
    }

    // jambes si debout
    if (lift > 0.2) {
      const jUp = (lift - 0.2) / 0.8;
      ctx.strokeStyle = '#2c3140'; ctx.lineWidth = 20;
      ctx.beginPath();
      ctx.moveTo(-22, headY + 185); ctx.lineTo(-26, headY + 185 + 130 * jUp);
      ctx.moveTo(22, headY + 185); ctx.lineTo(26, headY + 185 + 130 * jUp);
      ctx.stroke();
    }

    // tête
    ctx.save();
    ctx.translate(0, headY);
    ctx.rotate(lean);
    ctx.fillStyle = '#c9a188';
    ctx.beginPath(); ctx.arc(0, 0, 34, 0, Math.PI * 2); ctx.fill();
    // cheveux sombres ébouriffés
    ctx.fillStyle = '#241d18';
    ctx.beginPath();
    ctx.arc(0, -8, 35, Math.PI * 0.95, Math.PI * 2.15);
    ctx.quadraticCurveTo(30, -28, 8, -34);
    ctx.quadraticCurveTo(-26, -36, -33, -14);
    ctx.closePath(); ctx.fill();
    // yeux : fermés au début, clignent ensuite
    const blink = (S.time % 260) < 12 ? 0.15 : 1;
    const openEyes = lift > 0.5 ? blink : 0;
    if (openEyes > 0.2) {
      ctx.fillStyle = '#f4efe9';
      ctx.beginPath(); ctx.ellipse(-12, 2, 7, 5 * openEyes, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(12, 2, 7, 5 * openEyes, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#20242e';
      ctx.beginPath(); ctx.arc(-12, 2, 3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(12, 2, 3, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.strokeStyle = '#3a2e24'; ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(-18, 2); ctx.lineTo(-6, 2);
      ctx.moveTo(6, 2); ctx.lineTo(18, 2);
      ctx.stroke();
    }
    // bouche
    ctx.strokeStyle = '#7a5648'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    if (lift < 0.5) { ctx.moveTo(-7, 20); ctx.lineTo(7, 20); }
    else ctx.arc(0, 14, 8, 0.25 * Math.PI, 0.75 * Math.PI);
    ctx.stroke();
    // hématome
    ctx.fillStyle = 'rgba(120,70,90,0.4)';
    ctx.beginPath(); ctx.ellipse(20, -12, 9, 6, 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // zzz pendant le sommeil
    if (S.wakeAnim < 0.5) {
      ctx.fillStyle = 'rgba(200,210,240,' + (0.5 - S.wakeAnim) + ')';
      ctx.font = '20px Georgia';
      const fl = Math.sin(S.time / 25) * 6;
      ctx.fillText('z', 48 + fl, headY - 40);
      ctx.font = '26px Georgia';
      ctx.fillText('Z', 66 + fl, headY - 68);
    }
    ctx.restore();
  }

  function drawNoteHint() {
    // coin de papier qui dépasse du coussin si pas encore trouvé
    if (!S.noteFound && S.awake) {
      ctx.fillStyle = '#e8e2d0';
      ctx.beginPath();
      ctx.moveTo(446, 372); ctx.lineTo(468, 368); ctx.lineTo(470, 382); ctx.closePath();
      ctx.fill();
    }
  }

  function drawVignette() {
    const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.85);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  function drawLabel() {
    if (!S.awake || talking) return;
    // affiché via le curseur : rien ici, mais titre discret
    ctx.fillStyle = 'rgba(216,220,234,0.25)';
    ctx.font = '14px system-ui, sans-serif';
    ctx.fillText('LE RÉVEIL — chapitre 1', 18, 26);
  }

  function frame() {
    S.time++;
    if (S.awake && S.wakeAnim < 1) S.wakeAnim = Math.min(1, S.wakeAnim + 0.008);

    ctx.clearRect(0, 0, W, H);
    drawRoom();
    drawWindow();
    drawDoor();
    drawChair();
    drawNoteHint();
    drawSelf();
    drawVignette();
    drawLabel();
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
